name: Build Android APK

on:
  push:
    branches: [ "main" ] # Triggers the build every time you push code to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Uses a clean Linux virtual machine hosted by GitHub

    steps:
      # 1. Download your repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (JDK 17 is standard for modern Android development)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Caches Gradle dependencies for faster subsequent builds

      # 3. Grant execution permissions to the Gradle wrapper script
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Run Gradle command to build a Debug APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 5. Save the compiled APK as a downloadable artifact in GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
